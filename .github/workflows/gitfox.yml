name: gitfox\non:\n  pull_request:\n    types: [opened, synchronize, reopened]\n  issues:\n    types: [opened]\n  issue_comment:\n    types: [created]\n  workflow_dispatch:\n    inputs:\n      scan_all:\n        description: "Scan all open PRs and issues"\n        type: boolean\n        default: false\n\njobs:\n  gitfox:\n    runs-on: ubuntu-latest\n    timeout-minutes: 45\n    permissions:\n      contents: read\n      issues: write\n      pull-requests: write\n    concurrency:\n      group: gitfox-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}\n      cancel-in-progress: false\n    steps:\n      - uses: actions/checkout@v4\n      - uses: xCaptaiN09/gitfox@v1\n        with:\n          scan-all: ${{ github.event.inputs.scan_all == 'true' }}\n